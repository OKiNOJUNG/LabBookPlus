      <text x="14" y="48" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="800">18 ชิ้น</text>

      <g transform="translate(195, 0)">
        <rect width="180" height="60" rx="8" fill="#1e293b" stroke="#059669" />
        <text x="14" y="24" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700">พร้อมใช้งาน (Ready)</text>
        <text x="14" y="48" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="800">16 ชิ้น</text>
