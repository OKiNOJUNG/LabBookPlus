        <text x="215" y="20" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">CALIBRATION</text>
        <text x="280" y="20" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">ช่าง: นายสมศักดิ์ (Supplier A)</text>
        <text x="490" y="20" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">PO-6709-012</text>
        <text x="610" y="20" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">฿ 25,000.00</text>
        <!-- Attachment Gzip Pill -->
