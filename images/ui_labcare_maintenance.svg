        <text x="860" y="20" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">👁️ พรีวิว</text>
      </g>
      <line x1="16" y1="88" x2="904" y2="88" stroke="#1e293b" />

      <!-- Row 2 -->
      <g transform="translate(16, 102)">
        <text x="0" y="20" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">GC-MS Agilent 7890</text>
        <rect x="180" y="5" width="70" height="22" rx="11" fill="#f59e0b" fill-opacity="0.2" />
        <text x="215" y="20" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">PM 6 MONTHS</text>
        <text x="280" y="20" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">ช่าง: บจก. เทคโนแล็บ</text>
        <text x="490" y="20" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">PO-6708-044</text>
        <text x="610" y="20" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">฿ 18,500.00</text>
        <rect x="710" y="4" width="105" height="24" rx="4" fill="#059669" fill-opacity="0.25" stroke="#10b981" />
        <text x="762" y="20" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">📎 Cert.pdf (-65%)</text>
        <rect x="830" y="4" width="60" height="24" rx="4" fill="#0284c7" />
        <text x="860" y="20" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">👁️ พรีวิว</text>
      </g>
      <line x1="16" y1="140" x2="904" y2="140" stroke="#1e293b" />

      <!-- Row 3 -->
      <g transform="translate(16, 154)">
        <text x="0" y="20" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">Autoclave Tomy SX-700</text>
        <rect x="180" y="5" width="70" height="22" rx="11" fill="#ef4444" fill-opacity="0.2" />
        <text x="215" y="20" fill="#f87171" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">CORRECTIVE</text>
        <text x="280" y="20" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">เปลี่ยนปะเก็นฝาหม้อนึ่ง</text>
        <text x="490" y="20" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">PO-6708-011</text>
        <text x="610" y="20" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">฿ 6,200.00</text>
        <rect x="710" y="4" width="105" height="24" rx="4" fill="#059669" fill-opacity="0.25" stroke="#10b981" />
        <text x="762" y="20" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">📎 Bill.pdf (-81%)</text>
        <rect x="830" y="4" width="60" height="24" rx="4" fill="#0284c7" />
        <text x="860" y="20" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">👁️ พรีวิว</text>
