      <text x="16" y="23" fill="#f8fafc" font-family="'Segoe UI', Sarabun, sans-serif" font-size="12" font-weight="700">รายการประวัติซ่อมบำรุง &amp; สอบเทียบมาตรฐาน (Maintenance &amp; Calibration Logs)</text>

      <!-- Row 1 -->
