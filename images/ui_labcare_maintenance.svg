<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <filter id="shadow6" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Browser Frame Background -->
  <rect width="960" height="520" rx="12" fill="#0b1120" stroke="#334155" stroke-width="2" />

  <!-- Browser Title Bar -->
  <path d="M0 12 C0 5.37 5.37 0 12 0 L948 0 C954.63 0 960 5.37 960 12 L960 36 L0 36 Z" fill="#1e293b" />
  <circle cx="20" cy="18" r="5" fill="#ef4444" />
  <circle cx="36" cy="18" r="5" fill="#f59e0b" />
  <circle cx="52" cy="18" r="5" fill="#10b981" />
  <rect x="240" y="8" width="480" height="20" rx="10" fill="#0f172a" />
  <text x="480" y="22" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">https://labbookplus.netlify.app/CarePlus.html (MPIR Lab Care+)</text>

  <!-- App Header Navbar -->
  <g transform="translate(0, 36)">
    <rect width="960" height="48" fill="#0f172a" stroke="#334155" />
    <circle cx="30" cy="24" r="12" fill="#0284c7" />
    <text x="50" y="29" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800">MPIR Lab Care+</text>
    <rect x="180" y="14" width="70" height="20" rx="10" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" />
    <text x="215" y="28" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" text-anchor="middle">MAINTENANCE</text>

    <!-- Right Switch Buttons -->
    <rect x="670" y="11" width="95" height="26" rx="6" fill="#0f766e" fill-opacity="0.2" stroke="#0f766e" />
    <text x="717" y="27" fill="#2dd4bf" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">🧪 Lab Book+</text>

    <rect x="775" y="11" width="95" height="26" rx="6" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" />
    <text x="822" y="27" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">📖 Docs &amp; Guide</text>

    <circle cx="895" cy="24" r="12" fill="#334155" />
