<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="adminPurgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="960" height="480" rx="16" fill="url(#adminPurgeGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Title -->
  <g transform="translate(40, 25)">
    <text x="0" y="24" fill="#f8fafc" font-family="'Segoe UI', Sarabun, sans-serif" font-size="18" font-weight="800">Admin Control Panel: Storage Management &amp; Retention Purge Tool</text>
    <text x="0" y="44" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11.5">หน้าต่างบริหารจัดการพื้นที่ฐานข้อมูล การสำรองข้อมูลรวม 2 ระบบ และเครื่องมือเคลียร์ข้อมูลคืนพื้นที่อย่างปลอดภัย</text>
  </g>

  <!-- Card 1: Unified Backup & Cloud Status -->
  <g transform="translate(40, 85)">
    <rect width="880" height="155" rx="12" fill="#0f172a" stroke="#334155" />
    <rect width="880" height="34" rx="12" fill="#1e293b" />
    <text x="16" y="22" fill="#f59e0b" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">⚙️ SYSTEM DATA &amp; STORAGE (UNIFIED 2 SYSTEMS)</text>

    <!-- Buttons -->
    <g transform="translate(16, 48)">
      <rect width="210" height="36" rx="6" fill="#059669" />
      <text x="105" y="23" fill="#ffffff" font-family="'Segoe UI', Sarabun, sans-serif" font-size="12" font-weight="700" text-anchor="middle">📥 Backup All (2 Systems + POs)</text>

      <g transform="translate(225, 0)">
        <rect width="200" height="36" rx="6" fill="#d97706" />
        <text x="100" y="23" fill="#ffffff" font-family="'Segoe UI', Sarabun, sans-serif" font-size="12" font-weight="700" text-anchor="middle">📤 Import Unified JSON</text>
      </g>
    </g>

    <!-- Cloud Status Box -->
    <g transform="translate(16, 95)">
      <rect width="848" height="46" rx="8" fill="#1e293b" stroke="#059669" stroke-dasharray="3,3" />
      <circle cx="25" cy="23" r="8" fill="#10b981" />
      <text x="44" y="20" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">Firebase Cloud Database (Spark Plan - Free Tier 1GB)</text>
      <text x="44" y="36" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="10.5">● Connected: mpir-lab-suite (Zero-Config Global Auto-Connect Active)</text>
      
      <!-- Cloud Config Button -->
      <rect x="740" y="10" width="95" height="26" rx="4" fill="#0f172a" stroke="#475569" />
      <text x="787" y="27" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle">⚙️ Cloud Config</text>
    </g>
  </g>

  <!-- Card 2: Admin Storage Purge Tool -->
  <g transform="translate(40, 255)">
    <rect width="880" height="195" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <rect width="880" height="34" rx="12" fill="#78350f" fill-opacity="0.6" />
    <text x="16" y="22" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">🧹 เครื่องมือเคลียร์ข้อมูลคืนพื้นที่ (Storage Cleanup &amp; Quota Purge) - Admin Only</text>

    <!-- Master Data Guarantee Note -->
    <g transform="translate(16, 46)">
      <rect width="848" height="42" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#059669" />
      <text x="14" y="18" fill="#6ee7b7" font-family="'Segoe UI', Sarabun, sans-serif" font-size="11" font-weight="700">🛡️ การันตีความปลอดภัยสูงสุด 100% (Master Data Immutability):</text>
      <text x="14" y="34" fill="#cbd5e1" font-family="'Segoe UI', Sarabun, sans-serif" font-size="10.5">ลบเฉพาะประวัติการจองและประวัติซ่อมเก่าเท่านั้น ไม่มีทางลบข้อมูลเครื่องมือ, อาคาร, ห้องแล็บ หรือรายชื่อผู้ใช้งานเด็ดขาด</text>
    </g>

    <!-- Dropdown & Actions -->
    <g transform="translate(16, 102)">
      <text x="0" y="14" fill="#cbd5e1" font-family="'Segoe UI', Sarabun, sans-serif" font-size="11" font-weight="600">เลือกช่วงเวลาของประวัติที่จะล้าง:</text>
      
      <rect x="0" y="22" width="450" height="36" rx="6" fill="#1e293b" stroke="#475569" />
      <text x="14" y="45" fill="#f8fafc" font-family="'Segoe UI', Sarabun, sans-serif" font-size="11.5">เก่ากว่า 1 ไตรมาส (&gt; 90 วันที่ผ่านมา - ค่าแนะนำ)</text>
      <text x="425" y="44" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">▼</text>

      <!-- Action Buttons -->
      <g transform="translate(470, 22)">
        <rect width="210" height="36" rx="6" fill="url(#adminPurgeGrad)" stroke="#f59e0b" stroke-width="1.5" />
        <text x="105" y="23" fill="#f59e0b" font-family="'Segoe UI', Sarabun, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">💾 แบ็คอัพก่อนล้าง (Safety Backup)</text>
      </g>

      <g transform="translate(695, 22)">
        <rect width="153" height="36" rx="6" fill="#ef4444" />
        <text x="76" y="23" fill="#ffffff" font-family="'Segoe UI', Sarabun, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">🗑️ ล้างข้อมูลตามเงื่อนไข</text>
      </g>

      <text x="0" y="78" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">ตัวเลือกช่วงเวลา: &gt; 30 วัน, &gt; 90 วัน, &gt; 180 วัน, &gt; 1 ปี, &gt; 2 ปี, และลบประวัติการใช้งานทั้งหมดของ User (ล้างกระดานเฉพาะ Transaction)</text>
    </g>
  </g>
</svg>
