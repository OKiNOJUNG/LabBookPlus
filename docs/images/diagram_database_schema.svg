<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" rx="16" fill="url(#bgGrad4)" stroke="#334155" stroke-width="1.5" />

  <!-- Header Title -->
  <g transform="translate(40, 25)">
    <text x="0" y="24" fill="#f8fafc" font-family="'Segoe UI', Sarabun, sans-serif" font-size="20" font-weight="800">MPIR Lab Suite: Relational Data Schema &amp; ER Topology</text>
    <text x="0" y="44" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">แผนภาพความสัมพันธ์ของข้อมูล (Master Data, Bookings, Maintenance Records, และ Cloud Attachments)</text>
  </g>

  <!-- Entity: USERS -->
  <g transform="translate(40, 90)">
    <rect width="260" height="185" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="30" rx="8" fill="#1d4ed8" />
    <text x="12" y="20" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">USERS (ผู้ใช้งานระบบ)</text>

    <text x="12" y="50" fill="#f1f5f9" font-family="'Courier New', monospace" font-size="11">🔑 id: string (U-001)</text>
    <text x="12" y="70" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">👤 username: string (email)</text>
    <text x="12" y="90" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">🔒 password: string</text>
    <text x="12" y="110" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">🏷️ name: string (Full Name)</text>
    <text x="12" y="130" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">🛡️ role: 'admin' | 'user'</text>
    <text x="12" y="150" fill="#94a3b8" font-family="'Courier New', monospace" font-size="10.5">🌐 department: string</text>
    <text x="12" y="170" fill="#94a3b8" font-family="'Courier New', monospace" font-size="10.5">📞 phone: string</text>
  </g>

  <!-- Entity: BUILDINGS -->
  <g transform="translate(350, 90)">
    <rect width="260" height="110" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="30" rx="8" fill="#b45309" />
    <text x="12" y="20" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">BUILDINGS (อาคาร / ห้องแล็บ)</text>

    <text x="12" y="52" fill="#f1f5f9" font-family="'Courier New', monospace" font-size="11">🔑 id: string ("5", "6", "7")</text>
    <text x="12" y="72" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">🏢 name: string (Unit/Bldg Name)</text>
    <text x="12" y="92" fill="#94a3b8" font-family="'Courier New', monospace" font-size="10.5">📍 room: string (Optional)</text>
  </g>

  <!-- Entity: EQUIPMENTS -->
  <g transform="translate(660, 90)">
    <rect width="260" height="185" rx="8" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="30" rx="8" fill="#be185d" />
    <text x="12" y="20" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">EQUIPMENTS (เครื่องมือวิทยาศาสตร์)</text>

    <text x="12" y="50" fill="#f1f5f9" font-family="'Courier New', monospace" font-size="11">🔑 id: string (EQ-001)</text>
    <text x="12" y="70" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">🔬 name: string (Equipment)</text>
    <text x="12" y="90" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">🔗 building_id: FK -&gt; BUILDINGS</text>
    <text x="12" y="110" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">🏷️ serial: string (Asset No.)</text>
    <text x="12" y="130" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">👤 custodian: string</text>
    <text x="12" y="150" fill="#94a3b8" font-family="'Courier New', monospace" font-size="10.5">⚡ status: 'ready' | 'repair'</text>
    <text x="12" y="170" fill="#94a3b8" font-family="'Courier New', monospace" font-size="10.5">🖼️ qr_code: string</text>
  </g>

  <!-- Entity: BOOKINGS (Lab Book+) -->
  <g transform="translate(40, 310)">
    <rect width="260" height="180" rx="8" fill="#0f172a" stroke="#0f766e" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="30" rx="8" fill="#0f766e" />
    <text x="12" y="20" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">BOOKINGS (คิวจอง Lab Book+)</text>

    <text x="12" y="50" fill="#f1f5f9" font-family="'Courier New', monospace" font-size="11">🔑 id: string (B-1725...)</text>
    <text x="12" y="70" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">🔗 equipment_id: FK -&gt; EQUIPMENTS</text>
    <text x="12" y="90" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">🔗 user_id: FK -&gt; USERS</text>
    <text x="12" y="110" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">📅 start_time / end_time: string</text>
    <text x="12" y="130" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">⏱️ actual_start / actual_end</text>
    <text x="12" y="150" fill="#94a3b8" font-family="'Courier New', monospace" font-size="10.5">🎯 objective / recurring_id</text>
    <text x="12" y="168" fill="#94a3b8" font-family="'Courier New', monospace" font-size="10.5">✅ status: 'booked' | 'completed'</text>
  </g>

  <!-- Entity: RECORDS (Lab Care+) -->
  <g transform="translate(350, 235)">
    <rect width="260" height="255" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="30" rx="8" fill="#0369a1" />
    <text x="12" y="20" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">RECORDS (งานซ่อมบำรุง Lab Care+)</text>

    <text x="12" y="50" fill="#f1f5f9" font-family="'Courier New', monospace" font-size="11">🔑 id: string (rec-1725...)</text>
    <text x="12" y="70" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">🔗 equipment_id: FK -&gt; EQUIPMENTS</text>
    <text x="12" y="90" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">🏷️ type: 'pm' | 'cm' | 'calibration'</text>
    <text x="12" y="110" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">📅 date / schedule_date: string</text>
    <text x="12" y="130" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">👤 technician: string</text>
    <text x="12" y="150" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">👤 reporter: string</text>
    <text x="12" y="170" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">💵 cost: number</text>
    <text x="12" y="190" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">📄 po_number: string</text>
    <text x="12" y="210" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">📎 hasAttachment: boolean</text>
    <text x="12" y="230" fill="#38bdf8" font-family="'Courier New', monospace" font-size="11">🗜️ isGzipCompressed: boolean</text>
    <text x="12" y="248" fill="#94a3b8" font-family="'Courier New', monospace" font-size="10">⚡ status: 'scheduled' | 'done'</text>
  </g>

  <!-- Entity: PO_FILES / ATTACHMENTS -->
  <g transform="translate(660, 310)">
    <rect width="260" height="180" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="30" rx="8" fill="#047857" />
    <text x="12" y="20" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">ATTACHMENTS (Cloud &amp; Cache)</text>

    <text x="12" y="50" fill="#f1f5f9" font-family="'Courier New', monospace" font-size="11">🔑 id: FK -&gt; RECORDS.id</text>
    <text x="12" y="70" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">📁 fileName: string (.pdf)</text>
    <text x="12" y="90" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">📏 originalSize: number (bytes)</text>
    <text x="12" y="110" fill="#34d399" font-family="'Courier New', monospace" font-size="11">🗜️ compressedSize: number</text>
    <text x="12" y="130" fill="#34d399" font-family="'Courier New', monospace" font-size="11">📊 compressionRatio: string</text>
    <text x="12" y="150" fill="#38bdf8" font-family="'Courier New', monospace" font-size="11">☁️ firestoreDoc: 'lab_attachments'</text>
    <text x="12" y="168" fill="#94a3b8" font-family="'Courier New', monospace" font-size="10.5">💾 localStore: IndexedDB.poFiles</text>
  </g>

  <!-- Connection Lines -->
  <line x1="170" y1="275" x2="170" y2="310" stroke="#3b82f6" stroke-width="2" stroke-dasharray="3,3" />
  <line x1="480" y1="200" x2="660" y2="180" stroke="#f59e0b" stroke-width="2" />
  <line x1="790" y1="275" x2="790" y2="310" stroke="#ec4899" stroke-width="2" stroke-dasharray="3,3" />
  <line x1="610" y1="365" x2="660" y2="365" stroke="#10b981" stroke-width="2" />
</svg>
